<div class="state-list-page">
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Gestión de Departamentos</h1>
      <p class="page-subtitle">Listado de departamentos del sistema</p>
    </div>
    <button mat-flat-button color="primary" class="add-btn" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      <span>Nuevo Departamento</span>
    </button>
  </div>

  <div class="filters-row">
    <mat-form-field appearance="outline" class="country-filter">
      <mat-label>Filtrar por País</mat-label>
      <mat-select
        [value]="selectedCountryCode()"
        (selectionChange)="onCountryFilterChange($event.value)"
      >
        <mat-option [value]="null">Todos los países</mat-option>
        @for (country of countries(); track country.countryCode) {
          <mat-option [value]="country.countryCode">
            {{ country.countryName }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="states()"
    [totalItems]="totalItems()"
    [pageSize]="pageSize()"
    [loading]="loading()"
    [showSearch]="true"
    [searchPlaceholder]="'Buscar departamentos...'"
    [showExport]="false"
    [title]="''"
    [showAddButton]="false"
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
    (searchChange)="onSearchChange($event)"
    (rowAction)="onRowAction($event)"
  />

  @if (!loading() && states().length === 0) {
    <app-empty-state
      icon="map"
      title="Sin departamentos"
      message="No se encontraron departamentos registrados"
      [showAction]="false"
    />
  }
</div>
